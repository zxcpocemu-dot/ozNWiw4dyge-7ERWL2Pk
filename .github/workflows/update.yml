name: Auto Update VPN Sub

on:
  schedule:
    # Запуск каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch: # Позволяет запускать вручную

permissions:
  contents: write # Важно: разрешает скрипту сохранять изменения

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python filter.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update configs" && git push)
