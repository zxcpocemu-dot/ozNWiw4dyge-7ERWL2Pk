name: Auto Update VPN Sub

on:
  schedule:
    # Запуск каждые 20 минут
    - cron: '*/20 * * * *'
  workflow_dispatch: # Позволяет запускать вручную для теста

permissions:
  contents: write # Важно: разрешает скрипту сохранять файл output.txt в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем файлы репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем библиотеку requests
        run: pip install requests

      - name: Запускаем скрипт фильтрации и маскировки
        run: python filter.py

      - name: Сохраняем изменения (коммитим файл output.txt)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output.txt
          # Если файл изменился, делаем коммит и отправляем в репозиторий
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and mask configs" && git push)
